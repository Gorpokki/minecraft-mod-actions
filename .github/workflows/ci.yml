name: CI

# Lints this repository. Pull requests only: nothing here runs on push.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows and actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  zizmor:
    name: Scan with zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .
          collect: all
          config: .github/zizmor.yml
          version: 1.30.1
          advanced-security: 'false'
          annotations: 'true'

  tests:
    name: Test the gate scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install lizard 1.24.1
        run: python3 -m pip install lizard==1.24.1
      - name: Run unit tests
        run: |
          python3 -m unittest discover -s complexity-ratchet
          python3 -m unittest discover -s sarif-changed-lines
