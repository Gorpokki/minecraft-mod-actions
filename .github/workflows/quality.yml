name: Quality checks

# Reusable quality checks for a Gradle-built Java Minecraft mod. Call it from a workflow whose only trigger is
# `pull_request`: the changed-lines mode compares against the pull request's base branch.
#
# By default every check fails on any finding in the whole repository. Set changed-lines-only to gate only the
# lines a pull request changes, for example on a pull request that merges code from upstream. Vale prose always checks every Markdown file.
# skip-overridden-rules lists the Qlty rules that are ignored on @Override methods (default qlty:function-parameters).
#
# Jobs: code (Qlty lint and smells, complexity ratchet, poutine), workflows (zizmor), java (tests, coverage,
# mutation score) and prose (Vale).
#
# The caller repository carries the configs these jobs read: .qlty/qlty.toml and .qlty/configs/ (Qlty plugins,
# including PMD rules), .vale.ini (prose), and the Gradle tasks named by the inputs. Qlty CLI is licensed under
# Business Source License 1.1, see the README.
#
# A caller job:
#
#   quality:
#     uses: Gorpokki/minecraft-mod-actions/.github/workflows/quality.yml@<40-char-sha> # vX.Y.Z
#     with:
#       actions-ref: <the same 40-char-sha>
#       changed-lines-only: ${{ contains(github.event.pull_request.labels.*.name, 'upstream-sync') }}

on:
  workflow_call:
    inputs:
      actions-ref:
        description: Commit SHA of this repository, the same one the caller pins this workflow to. Its composite actions are checked out at this ref.
        type: string
        required: true
      changed-lines-only:
        description: Gate only the lines a pull request changes.
        type: boolean
        default: false
      java-version:
        description: Java version for the java job.
        type: string
        default: '21'
      java-distribution:
        description: Java distribution for actions/setup-java.
        type: string
        default: temurin
      gradle-test-tasks:
        description: Gradle tasks that run the tests and write the coverage report.
        type: string
        default: build jacocoTestReport
      coverage-report:
        description: Path of the coverage XML report the test tasks write.
        type: string
        default: build/reports/jacoco/test/jacocoTestReport.xml
      coverage-verify-tasks:
        description: Gradle tasks that enforce the coverage floor on the whole repository. Run when changed-lines-only is false. Empty skips them.
        type: string
        default: jacocoTestCoverageVerification
      coverage-min:
        description: Coverage floor in percent. Diff-cover uses it for changed lines, and Gradle gets it as -PcoverageMin.
        type: string
        default: '80'
      mutation-tasks:
        description: Gradle tasks that run mutation testing. Empty skips them.
        type: string
        default: pitest
      mutation-min:
        description: Mutation score floor in percent, passed to Gradle as -PmutationThreshold. Empty leaves the floor to the caller's Gradle build.
        type: string
        default: ''
      src-roots:
        description: Source roots for diff-cover, space-separated.
        type: string
        default: src/main/java
      pathspec:
        description: git pathspecs of the files the complexity ratchet checks, one per line.
        type: string
        default: '*.java'
      extensions:
        description: File extensions the complexity ratchet checks, separated by spaces. Use * to check every matched file.
        type: string
        default: '.py .js .cjs .cs .java'
      ccn-max:
        description: Maximum cyclomatic complexity per function.
        type: string
        default: '10'
      cognitive-max:
        description: Maximum cognitive complexity per function.
        type: string
        default: '15'
      qlty-fail-level:
        description: Lowest Qlty issue level that fails the lint step.
        type: string
        default: low
      skip-overridden-rules:
        description: Qlty rule ids, one per line, whose results are ignored on @Override methods. Empty checks them there too.
        type: string
        default: qlty:function-parameters

permissions:
  contents: read

env:
  BASE: ${{ format('origin/{0}', github.base_ref) }}
  CHANGED_LINES_ONLY: ${{ inputs.changed-lines-only }}

jobs:
  code:
    name: Check code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: python:3.11.17-trixie@sha256:50cfccc707e8721201ee018bfd7f6a85d8eacf49c4f9f75833a2aba09a10411f
    defaults:
      run:
        shell: bash
    env:
      QLTY_TELEMETRY: 'off'
      QLTY_FAIL_LEVEL: ${{ inputs.qlty-fail-level }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Qlty CLI 0.652.0 and poutine 1.1.6
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo qlty.tar.xz https://github.com/qltysh/qlty/releases/download/v0.652.0/qlty-x86_64-unknown-linux-musl.tar.xz
          curl -fsSLo poutine.tar.gz https://github.com/boostsecurityio/poutine/releases/download/v1.1.6/poutine_Linux_x86_64.tar.gz
          echo '9d56dfaf60ca52281a7465c9b0a82389071d56a9d014703b4d9f8b8da1f55d50  qlty.tar.xz' | sha256sum -c
          echo 'abde716599a65608b023a69ed9316e5f083a7bca48612151c2720835883757ea  poutine.tar.gz' | sha256sum -c
          mkdir -p bin
          tar -xJf qlty.tar.xz -C bin --strip-components=1
          tar -xzf poutine.tar.gz -C bin poutine
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Plugin versions, configs and reasoned ignores: .qlty/qlty.toml and .qlty/configs/.
      - name: Lint with every Qlty plugin in .qlty/qlty.toml
        run: |
          if [ "$CHANGED_LINES_ONLY" = true ]; then
            qlty check --upstream "$BASE" --no-formatters --no-progress --fail-level "$QLTY_FAIL_LEVEL"
          else
            qlty check --all --no-formatters --no-progress --fail-level "$QLTY_FAIL_LEVEL"
          fi
      # `qlty smells` exits 0 either way. The sarif-changed-lines action decides what fails.
      - name: Collect Qlty code smells
        if: ${{ !cancelled() }}
        run: |
          if [ "$CHANGED_LINES_ONLY" = true ]; then
            qlty smells --upstream "$BASE" --sarif --quiet --no-snippets > "$RUNNER_TEMP/smells.sarif"
          else
            qlty smells --all --sarif --quiet --no-snippets > "$RUNNER_TEMP/smells.sarif"
          fi
      - name: Check workflows for supply-chain risks
        if: ${{ !cancelled() }}
        run: poutine analyze_local . --quiet --fail-on-violation
      # Checked out after the scans above, so Qlty and poutine never see these files.
      - name: Check out the composite actions
        if: ${{ !cancelled() }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Gorpokki/minecraft-mod-actions
          ref: ${{ inputs.actions-ref }}
          path: .mma-actions
          persist-credentials: false
      - name: Fail on Qlty code smells
        if: ${{ !cancelled() }}
        uses: ./.mma-actions/sarif-changed-lines
        with:
          sarif-file: ${{ runner.temp }}/smells.sarif
          base: ${{ inputs.changed-lines-only && env.BASE || '' }}
          skip-overridden-rules: ${{ inputs.skip-overridden-rules }}
      # Lizard misreads some record declarations and then skips a file's functions.
      # Add complexity rules to the PMD config as a backup.
      - name: Fail functions above the complexity limits
        if: ${{ !cancelled() }}
        uses: ./.mma-actions/complexity-ratchet
        with:
          ccn-max: ${{ inputs.ccn-max }}
          cognitive-max: ${{ inputs.cognitive-max }}
          pathspec: ${{ inputs.pathspec }}
          extensions: ${{ inputs.extensions }}
          base: ${{ inputs.changed-lines-only && env.BASE || '' }}

  workflows:
    name: Scan workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan whole workflow files with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          version: 1.30.1
          online-audits: 'false'
          advanced-security: 'false'
          annotations: 'true'

  java:
    name: Check test coverage and mutation score
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_TASKS: ${{ inputs.gradle-test-tasks }}
      VERIFY_TASKS: ${{ inputs.coverage-verify-tasks }}
      MUTATION_TASKS: ${{ inputs.mutation-tasks }}
      COVERAGE_MIN: ${{ inputs.coverage-min }}
      MUTATION_MIN: ${{ inputs.mutation-min }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Run the tests with coverage
        run: |
          read -ra tasks <<< "$TEST_TASKS"
          ./gradlew --no-daemon "${tasks[@]}"
      - name: Check out the composite actions
        if: ${{ inputs.changed-lines-only }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Gorpokki/minecraft-mod-actions
          ref: ${{ inputs.actions-ref }}
          path: .mma-actions
          persist-credentials: false
      - name: Fail when coverage of the changed lines is under the floor
        if: ${{ inputs.changed-lines-only }}
        uses: ./.mma-actions/diff-coverage
        with:
          report: ${{ inputs.coverage-report }}
          compare-branch: ${{ env.BASE }}
          src-roots: ${{ inputs.src-roots }}
          fail-under: ${{ inputs.coverage-min }}
      - name: Fail when coverage of the whole repository is under the floor
        if: ${{ !inputs.changed-lines-only && inputs.coverage-verify-tasks != '' }}
        run: |
          read -ra tasks <<< "$VERIFY_TASKS"
          ./gradlew --no-daemon "${tasks[@]}" "-PcoverageMin=$COVERAGE_MIN"
      - name: Fail when mutation testing is under the floor
        if: ${{ !cancelled() && inputs.mutation-tasks != '' }}
        run: |
          read -ra tasks <<< "$MUTATION_TASKS"
          floor=()
          [ -z "$MUTATION_MIN" ] || floor=("-PmutationThreshold=$MUTATION_MIN")
          ./gradlew --no-daemon "${tasks[@]}" "${floor[@]}"

  prose:
    name: Check Markdown prose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Vale with a style named in .vale.ini; any alert fails, including suggestions.
      - name: Fail on any Vale alert
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.24.0
          reporter: local
          fail_level: any
          min_alert_level: suggestion
          filter_mode: nofilter
          files: all
